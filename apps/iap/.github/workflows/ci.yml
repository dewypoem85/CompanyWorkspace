name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: iap
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: iap
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U iap" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:db
        env:
          DATABASE_URL: postgres://iap:ci-test-only@localhost:5432/iap
