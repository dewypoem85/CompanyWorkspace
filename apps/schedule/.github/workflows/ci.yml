name: Schedule CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm test
      - run: python3 scripts/test-import-release-sheet.py
      - run: npm run build
      - run: dotnet test tests/Schedule.Tests.csproj -c Release
      - run: docker build -t schedule:test .
