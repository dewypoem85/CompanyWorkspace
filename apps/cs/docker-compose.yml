services:
  steam-refund-cs:
    build: .
    container_name: steam-refund-cs
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - refund-audit:/app/data
    networks:
      - default
      - company-services
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  refund-audit:

networks:
  company-services:
    external: true
    name: company-services
